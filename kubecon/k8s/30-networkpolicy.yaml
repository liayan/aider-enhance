# One policy for every tier, so tiers differ only by runtime. Default-deny
# ingress and egress; allow DNS and the model gateway, nothing else.
# Only effective on a CNI that enforces NetworkPolicy (Calico, Cilium, ...);
# the network-egress check verifies that instead of assuming it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agent-lab-egress, namespace: agent-lab}
spec:
  podSelector: {matchLabels: {app: agent-lab}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: agent-gateway}}
      podSelector: {matchLabels: {app: model-gateway}}
    ports: [{protocol: TCP, port: 8080}]
